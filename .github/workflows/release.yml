name: Release

# Builds the Windows exe and publishes a GitHub Release with it attached.
#
# Triggers:
#   - push a tag like "v0.0.1" (the normal way: see "Cutting a release" below)
#   - manually from the Actions tab, giving the tag to release
#
# Cutting a release:
#   git tag v0.0.1
#   git push origin v0.0.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist, e.g. v0.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out ${{ inputs.tag || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -ldflags "-s -w" -o shadowplay-observer.exe .

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $stage = "shadowplay-observer-$tag"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item shadowplay-observer.exe, README.md $stage
          Copy-Item docs\DETAILS.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            shadowplay-observer.exe
            shadowplay-observer-*.zip
